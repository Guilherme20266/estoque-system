<!DOCTYPE html>
<html>
<head>

<title>{% block title %}Sistema{% endblock %}</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#007bff">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Estoque">

<link rel="icon" type="image/png" href="/static/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/static/icon-192.png">

{% block head %}{% endblock %}

<style>
{% block style %}{% endblock %}
</style>

</head>

<body>

{% block content %}{% endblock %}

{% block script %}{% endblock %}


<style>

/* =========================================================
   TEMA GERAL DO SISTEMA
========================================================= */

:root {
    --bg: #f4f4f4;
    --text: #111827;
    --text-secondary: #6b7280;

    --surface: #ffffff;
    --surface-secondary: #f8fafc;

    --border: #e5e7eb;

    --input-bg: #ffffff;
    --input-text: #111827;
}


/* =========================================================
   HTML E BODY
========================================================= */

html {
    min-height: 100%;
    background-color: var(--bg);
}

body {
    min-height: 100vh;
    margin: 0;

    background-color: var(--bg);
    color: var(--text);

    transition:
        background-color 0.25s ease,
        color 0.25s ease;
}


/* =========================================================
   MODO ESCURO
========================================================= */

body.dark-mode {

    --bg: #0f172a;
    --text: #f8fafc;
    --text-secondary: #cbd5e1;

    --surface: #1e293b;
    --surface-secondary: #172033;

    --border: #334155;

    --input-bg: #0f172a;
    --input-text: #f8fafc;

    background-color: var(--bg) !important;
    color: var(--text) !important;
}

html:has(body.dark-mode) {
    background-color: #0f172a !important;
}


/* =========================================================
   TEXTOS
========================================================= */

body.dark-mode h1,
body.dark-mode h2,
body.dark-mode h3,
body.dark-mode h4,
body.dark-mode h5,
body.dark-mode h6,
body.dark-mode p,
body.dark-mode label,
body.dark-mode span {
    color: inherit;
}


/* =========================================================
   CAMPOS
========================================================= */

body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea {

    background-color: var(--input-bg) !important;

    color: var(--input-text) !important;

    border-color: var(--border) !important;
}


body.dark-mode input::placeholder,
body.dark-mode textarea::placeholder {

    color: #94a3b8 !important;
}


/* =========================================================
   CARDS / CAIXAS
========================================================= */

body.dark-mode .card,
body.dark-mode .topo,
body.dark-mode .container,
body.dark-mode .painel,
body.dark-mode .panel {
    background-color: var(--surface) !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
}


/* =========================================================
   TABELAS
========================================================= */

body.dark-mode table {

    color: var(--text) !important;
}


body.dark-mode th {

    background-color: #172033 !important;

    color: #f8fafc !important;
}


body.dark-mode td {

    background-color: var(--surface) !important;

    color: var(--text) !important;

    border-color: var(--border) !important;
}


/* =========================================================
   LINKS
========================================================= */

body.dark-mode a:not(.btn) {

    color: #93c5fd;
}


/* =========================================================
   BOTÃO DE TEMA
========================================================= */

.theme-toggle {

    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: #ffffff;
    color: #111827;

    font-size: 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 4px 15px rgba(0,0,0,.25);

    z-index: 99999;

    transition:
        background .25s ease,
        color .25s ease,
        transform .2s ease;
}


.theme-toggle:hover {

    transform: scale(1.08);
}


body.dark-mode .theme-toggle {

    background: #1e293b;

    color: #ffffff;

    box-shadow:
        0 4px 15px rgba(0,0,0,.45);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:600px) {

    .theme-toggle {

        right:15px;
        bottom:15px;

        width:46px;
        height:46px;
    }

}

</style>


<!-- =======================================================
     BOTÃO DE TEMA
======================================================= -->

<button
    id="themeToggle"
    class="theme-toggle"
    type="button"
    aria-label="Alternar tema"
>
    🌙
</button>


<script>

(function () {

    const botao =
        document.getElementById("themeToggle");


    if (!botao) return;


    function aplicarTema() {

        const tema =
            localStorage.getItem("modoEstoque");


        if (tema === "dark") {

            document.body.classList.add("dark-mode");

            botao.textContent = "☀️";

            botao.title = "Modo dia";

        } else {

            document.body.classList.remove("dark-mode");

            botao.textContent = "🌙";

            botao.title = "Modo noite";
        }

    }


    aplicarTema();


    botao.addEventListener("click", function () {

        const estaNoite =
            document.body.classList.contains("dark-mode");


        localStorage.setItem(
            "modoEstoque",
            estaNoite ? "light" : "dark"
        );


        aplicarTema();

    });


})();

</script>


</body>
</html>
